<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<!-- A classe page-cadastro ativa o fundo escuro imersivo -->
<body class="page-cadastro">
    <header>
        <h1>TechStore 🖥️</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li><a href="relatorio.html">Relatório</a></li>
            </ul>
        </nav>
    </header>

    <div class="cadastro-container">
        <div class="cadastro-card">
            <h2>Crie sua conta</h2>
            <p class="subtitulo">Junte-se à elite da tecnologia.</p>
            
            <form id="formCadastro">
                <div class="input-group">
                    <input type="text" name="nome" placeholder="Nome Completo" required>
                    <span class="icon">👤</span>
                </div>
                
                <div class="input-group">
                    <input type="email" name="email" placeholder="E-mail" required>
                    <span class="icon">✉️</span>
                </div>
                
                <div class="input-group">
                    <input type="text" name="cpf" placeholder="CPF" required>
                    <span class="icon">🪪</span>
                </div>
                
                <div class="input-group">
                    <input type="number" name="idade" placeholder="Idade" min="18" required>
                    <span class="icon">🎂</span>
                </div>
                
                <button type="submit">Finalizar Cadastro</button>
                <p id="msg"></p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const form = e.target;
            const msg = document.getElementById('msg');
            
            if (!form.nome.value || !form.email.value || !form.cpf.value || !form.idade.value) {
                msg.style.color = "#ef4444"; // Vermelho moderno
                msg.textContent = "Por favor, preencha todos os campos!";
                return;
            }

            const dados = new FormData(form);
            try {
                const resposta = await fetch('../backend/cadastrar.php', { method: 'POST', body: dados });
                const json = await resposta.json();
                
                msg.style.color = json.ok ? "#10b981" : "#ef4444"; // Verde ou Vermelho
                msg.textContent = json.msg;
                if (json.ok) form.reset(); 
            } catch (erro) {
                msg.style.color = "#ef4444";
                msg.textContent = "Erro de conexão com o servidor.";
            }
        });
    </script>
</body>
</html>
